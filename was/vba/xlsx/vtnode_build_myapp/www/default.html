<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello, VTNode!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #0d1117;
            color: #f0f6fc;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin: 0 0 18px;

            font-size: 52px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .message {
            margin: 0;

            font-size: 18px;
            color: #8b949e;
        }

        .line {
            width: 64px;
            height: 2px;

            margin: 32px auto;

            background: #2f81f7;
        }

        .product {
            font-size: 14px;
            color: #6e7681;
        }

        .status {
            margin-top: 10px;

            font-size: 13px;
            color: #3fb950;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Hello, VTNode!</h1>

        <p class="message">
            This page is served directly from Excel/VBA.
        </p>

        <div class="line"></div>

        <div class="product">
            VTNode WAS for XLSX (VBA)
        </div>

        <div class="status">
            ● Server is running
        </div>

    </main>

</body>
</html>
